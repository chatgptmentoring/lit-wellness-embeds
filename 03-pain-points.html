<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LIT Wellness — Sound Familiar (cards only)</title>

<!--
  SEO NOTE — read before placing this.
  This embed deliberately contains NO heading. The "SOUND FAMILIAR?" eyebrow
  and the H2 above it must stay as REAL Wix text, because Build Guide 10.2
  assigns homepage keywords to that H2. Google cannot read text inside an
  embed. Native heading on top, this embed directly beneath it.

  Background is transparent on purpose — it picks up whatever colour the
  Wix section behind it is set to.

  Each card has its own icon that draws itself in:
    1 diets that stop  -> a cycle that keeps restarting
    2 emotional eating -> a heart with a fork
    3 feeling stuck    -> a signpost pointing two ways
    4 structure, not restriction -> an open padlock over a grid

  SIZE  desktop: 250 (four columns at every desktop width)
        mobile:  stacks one card per row, ~440 at 300-320px wide
               (fits its box via shared/fit.js — drag the mobile box to ~440)
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">

<style>
  .wrap { padding: 8px 0 12px; min-height: 250px; will-change: transform; }

  /* Four columns at EVERY desktop width — never wraps, so the section
     height stays one number. Fixed card height absorbs text wrapping. */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 1.4vw, 20px);
  }

  .card {
    position: relative;
    height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px clamp(16px, 1.8vw, 26px);
    overflow: hidden;
    transition: border-color .3s var(--ease), box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  /* Warm corner glow on hover. */
  .card::after {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(216,195,165,.45), rgba(216,195,165,0) 70%);
    opacity: 0;
    transition: opacity .35s var(--ease);
    pointer-events: none;
  }
  .card:hover { border-color: var(--tan); box-shadow: var(--shadow); transform: translateY(-4px); }
  .card:hover::after { opacity: 1; }

  .mark {
    position: relative;
    z-index: 1;
    width: clamp(48px, 4.4vw, 60px);
    height: clamp(48px, 4.4vw, 60px);
    flex: none;
    margin-bottom: clamp(14px, 1.6vw, 20px);
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, rgba(169,80,47,.12), rgba(216,195,165,.28));
    transition: transform .4s var(--ease);
  }
  .card:hover .mark { transform: rotate(-6deg) scale(1.06); }
  .mark svg {
    width: 62%; height: 62%;
    fill: none;
    stroke: var(--terracotta);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }
  .mark svg .accent { stroke: var(--blue); }

  /* Line icons draw themselves in when the card reveals. */
  .mark svg .d { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .card.is-visible .mark svg .d { animation: draw 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  .card.is-visible .mark svg .late { animation-delay: .45s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .card p {
    position: relative;
    z-index: 1;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: clamp(16px, 1.55vw, 21px);
    line-height: 1.38;
    margin: 0;
    color: var(--ink);
  }

  /* ================= Mobile: stack, icon beside the text ================= */
  @media (max-width: 749.98px) {
    .wrap { min-height: 0; padding: 4px 0 8px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
    .card {
      height: auto;
      min-height: 98px;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border-radius: 14px;
    }
    .mark { width: 54px; height: 54px; margin-bottom: 0; border-radius: 14px; }
    .card p { font-size: 17px; line-height: 1.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark svg .d { stroke-dashoffset: 0; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap locked" data-fit>
  <div class="shell">
    <div class="grid">

      <!-- 1. Diets that stop after a few weeks: the restart cycle -->
      <div class="card" data-reveal data-reveal-delay="0">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path pathLength="1" class="d" d="M20 12a8 8 0 0 1-13.7 5.6"/>
            <path pathLength="1" class="d" d="M4 12a8 8 0 0 1 13.7-5.6"/>
            <path pathLength="1" class="d late" d="M18 3.5v3.3h-3.3"/>
            <path pathLength="1" class="d late" d="M6 20.5v-3.3h3.3"/>
            <path pathLength="1" class="d late accent" d="M9.5 12.2h5"/>
          </svg>
        </div>
        <p>You start diets and stop after a few weeks</p>
      </div>

      <!-- 2. Emotional eating: a heart with a fork -->
      <div class="card" data-reveal data-reveal-delay="90">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path pathLength="1" class="d" d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/>
            <path pathLength="1" class="d late accent" d="M10.3 9.8v2.4a1.7 1.7 0 0 0 3.4 0V9.8M12 9.8v7"/>
          </svg>
        </div>
        <p>You struggle with emotional eating</p>
      </div>

      <!-- 3. Stuck, not knowing what works: a signpost pointing two ways -->
      <div class="card" data-reveal data-reveal-delay="180">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path pathLength="1" class="d" d="M12 21.5V3"/>
            <path pathLength="1" class="d late" d="M12 5h6.5l2.5 2.5-2.5 2.5H12"/>
            <path pathLength="1" class="d late accent" d="M12 12H5.5L3 14.5 5.5 17H12"/>
          </svg>
        </div>
        <p>You feel stuck and do not know what works</p>
      </div>

      <!-- 4. Structure, not restriction: an open padlock over a grid -->
      <div class="card" data-reveal data-reveal-delay="270">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path pathLength="1" class="d" d="M5 11.5h14v9H5z"/>
            <path pathLength="1" class="d" d="M5 16h14M12 11.5v9"/>
            <path pathLength="1" class="d late accent" d="M8.2 11.5V7.6a3.8 3.8 0 0 1 7.3-1.5"/>
          </svg>
        </div>
        <p>You want structure but not restriction</p>
      </div>

    </div>
  </div>
</div>

<script src="shared/fit.js"></script>
<script src="shared/embed.js"></script>
</body>
</html>
