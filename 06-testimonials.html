<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LIT Wellness — Testimonials</title>

<!--
  Quotes are taken verbatim from the reviews already published on
  litwellnesssolutions.com. Nothing here is invented.

  ⚠️ ATTRIBUTION IS DELIBERATELY BLANK. The live site publishes these
  quotes with no names attached, so there is nothing to attribute them
  to. Unattributed testimonials are noticeably weaker than named ones.
  Ask Tanya for a first name + last initial (e.g. "Sarah M.") or a role
  ("Fleet safety director") for each, and the markup below has the slot
  ready — uncomment the <cite> line and fill it in.

  Transparent background: inherits the Wix section colour behind it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">

<style>
  .wrap { padding: 8px 0 12px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .quote {
    display: flex;
    flex-direction: column;
    background: var(--blue-wash);
    border-radius: var(--radius);
    padding: 34px 32px 32px;
    position: relative;
  }

  .stars { display: flex; gap: 3px; margin-bottom: 18px; }
  .stars svg { width: 17px; height: 17px; fill: var(--terracotta); }

  .quote blockquote {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
  }

  .quote cite {
    margin-top: 20px;
    font-family: var(--font-body);
    font-style: normal;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .04em;
    color: var(--blue);
  }

  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .quote { padding: 28px 26px 26px; }
    .quote blockquote { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="shell">
    <div class="grid">

      <figure class="quote" data-reveal data-reveal-delay="0">
        <div class="stars" role="img" aria-label="5 out of 5 stars">
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
        </div>
        <blockquote>&ldquo;I had the pleasure of having Tanya Jolliffe as my dietitian. She is AMAZING. Not only is she a great person, but she is kind, understanding, and patient as well.&rdquo;</blockquote>
        <!-- <cite>Name here</cite> -->
      </figure>

      <figure class="quote" data-reveal data-reveal-delay="90">
        <div class="stars" role="img" aria-label="5 out of 5 stars">
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
        </div>
        <blockquote>&ldquo;My experience with Tanya has been life changing on so many levels. Not only physically, but mentally, emotionally and spiritually. She has a wonderful way of getting to the root of your issues without judgement or condemnation.&rdquo;</blockquote>
        <!-- <cite>Name here</cite> -->
      </figure>

      <figure class="quote" data-reveal data-reveal-delay="180">
        <div class="stars" role="img" aria-label="5 out of 5 stars">
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
        </div>
        <blockquote>&ldquo;Tanya is wonderful! She provides everything needed to re-examine negative habits and confront issues in a healthy productive way and holds accountability without stigma, shame or guilt. Thank you!&rdquo;</blockquote>
        <!-- <cite>Name here</cite> -->
      </figure>

    </div>
  </div>
</div>

<script src="shared/embed.js"></script>
</body>
</html>
