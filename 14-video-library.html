<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LIT Wellness — Video Library</title>

<!--
  THE FULL SPEAKING & MEDIA LIBRARY — all 32 talks from links.txt.
  Every video ID was checked against YouTube oEmbed: all public, all
  embeddable. Channel names are the real uploaders.

  HOW IT BEHAVES
  - One player. It shows a still poster until someone presses play, so the
    page loads 1 image + small thumbnails, never 32 YouTube players.
  - Clicking a talk in the playlist plays it right here (youtube-nocookie).
  - Category tabs + search across all 32. Prev / next buttons.

  URL OPTIONS (combine with &)
    ?cat=driver    open on one category: driver | eating | culture |
                   podcast | story. e.g. on /transportation-health
    ?v=VIDEO_ID    open with that talk in the player

  HEADING: carries its own heading. /speaking has no assigned keywords
  (Build Guide 10.2), so no native Wix H2 is required above it.

  SIZE: desktop height locked at 830. Mobile is not locked: shared/fit.js
  fits the section to whatever box the Wix Classic mobile view gives it.
  Drag the mobile box to ~900.

  ADDING A TALK: add one line to TALKS below. Height does not change —
  the playlist scrolls.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">

<style>
  /* Dark "screening room" band. Painted on <html> so fit-to-box spare
     space matches (see shared/fit.js). */
  html {
    background:
      radial-gradient(700px 420px at 100% 0%, rgba(169,80,47,.22), rgba(169,80,47,0) 70%),
      radial-gradient(800px 520px at 0% 100%, rgba(216,195,165,.10), rgba(216,195,165,0) 70%),
      linear-gradient(160deg, #26445E 0%, #1B3147 55%, #152739 100%) !important;
  }
  html, body { height: 100%; }
  body { background: transparent; color: var(--white); }

  :root {
    --muted: rgba(255,255,255,.64);
    --line:  rgba(255,255,255,.12);
    --panel: rgba(255,255,255,.05);
  }

  .lib { padding: 64px 0; min-height: 830px; will-change: transform; }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 26px;
  }
  .intro { max-width: 600px; }
  .intro .eyebrow {
    color: var(--tan);
    margin-bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .intro .eyebrow::before { content: ''; width: 26px; height: 1.5px; background: var(--terracotta-2); }
  .intro .h2 { color: var(--white); }
  .intro .h2 em { font-style: italic; color: var(--tan); }
  .lede { color: var(--muted); margin-top: 10px; }

  .search {
    position: relative;
    flex: none;
    width: 300px;
  }
  .search svg {
    position: absolute; left: 16px; top: 50%;
    width: 18px; height: 18px; transform: translateY(-50%);
    fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round;
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.07);
    color: var(--white);
    font: 500 15px var(--font-body);
    outline: none;
    transition: border-color .2s var(--ease), background-color .2s var(--ease);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--tan); background: rgba(255,255,255,.11); }
  .search input::-webkit-search-cancel-button { filter: invert(1); opacity: .6; }

  /* ---------- Category tabs ---------- */
  /* One row that scrolls sideways, never wraps — wrapping would change
     the locked height. */
  .tabs {
    display: flex;
    gap: 8px;
    height: 42px;
    margin-bottom: 22px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: rgba(255,255,255,.86);
    font: 600 14px var(--font-body);
    cursor: pointer;
    transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
  }
  .tab:hover { border-color: rgba(255,255,255,.34); }
  .tab b {
    font-weight: 600;
    font-size: 11.5px;
    min-width: 22px; height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.1);
  }
  .tab[aria-pressed="true"] { background: var(--terracotta); border-color: var(--terracotta); color: var(--white); }
  .tab[aria-pressed="true"] b { background: rgba(255,255,255,.22); }

  /* ---------- Player + playlist ---------- */
  .row {
    display: grid;
    grid-template-columns: minmax(0, 640px) minmax(270px, 1fr);
    gap: 24px;
    height: 460px;
  }

  /* Fixed 360px stage: 640x360 is exact 16:9, and a fixed height keeps
     the section height locked at every desktop width. */
  .stage {
    position: relative;
    height: 360px;
    border-radius: 16px;
    overflow: hidden;
    background: #0B1620;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.7);
  }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    padding: 0; border: 0; cursor: pointer;
    background: #0B1620;
  }
  .poster img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .8s var(--ease), filter .4s var(--ease);
  }
  .poster::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(8,16,24,.72) 0%, rgba(8,16,24,.1) 45%, rgba(8,16,24,.25) 100%);
  }
  .poster:hover img { transform: scale(1.03); filter: brightness(1.05); }

  .big-play {
    position: absolute; z-index: 2;
    left: 50%; top: 50%;
    width: 78px; height: 78px;
    margin: -39px 0 0 -39px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--terracotta);
    box-shadow: 0 16px 40px -10px rgba(169,80,47,.8);
    transition: transform .3s var(--ease), background-color .3s var(--ease);
  }
  .big-play::before {
    content: ''; position: absolute; inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.5);
    animation: ring 2.4s var(--ease) infinite;
  }
  @keyframes ring { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  .big-play svg { width: 28px; height: 28px; margin-left: 4px; fill: var(--white); }
  .poster:hover .big-play { transform: scale(1.08); background: var(--terracotta-h); }

  .now {
    height: 100px;
    padding-top: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }
  .now-text { min-width: 0; }
  .now-eyebrow {
    margin: 0 0 6px;
    display: flex; align-items: center; gap: 8px;
    font: 600 11px var(--font-body);
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--tan);
  }
  .now h3 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.25;
    color: var(--white);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .now-source {
    margin: 4px 0 0;
    font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .controls { display: flex; align-items: center; gap: 8px; flex: none; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background-color .2s var(--ease), border-color .2s var(--ease);
  }
  .icon-btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.34); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .yt-link {
    display: inline-flex; align-items: center; gap: 6px;
    height: 40px; padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font: 600 13px var(--font-body);
    color: var(--white); text-decoration: none;
    transition: background-color .2s var(--ease);
  }
  .yt-link:hover { background: rgba(255,255,255,.1); }
  .yt-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Animated "playing" bars. */
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  .eq i { width: 3px; background: var(--terracotta-2); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 60%; }
  .eq i:nth-child(2) { height: 100%; animation-delay: -.3s; }
  .eq i:nth-child(3) { height: 45%; animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .eq i { transform-origin: bottom; }
  .paused .eq i { animation-play-state: paused; transform: scaleY(.5); }

  .playlist {
    height: 460px;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
  }
  .pl-head {
    flex: none;
    height: 50px;
    padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.08);
    font: 600 12px var(--font-body);
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  .pl-head strong { color: var(--white); letter-spacing: .04em; text-transform: none; font-size: 14px; }

  .list {
    flex: 1;
    min-height: 0;
    margin: 0; padding: 8px;
    list-style: none;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.25) transparent;
  }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 8px; }

  .item {
    width: 100%;
    display: grid;
    grid-template-columns: 116px 1fr;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    position: relative;
    transition: background-color .2s var(--ease);
  }
  .item:hover { background: rgba(255,255,255,.07); }
  .item[aria-current="true"] { background: rgba(255,255,255,.1); }
  .item[aria-current="true"]::before {
    content: ''; position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 3px; background: var(--terracotta-2);
  }

  .th {
    position: relative;
    width: 116px; height: 65px;
    border-radius: 8px;
    overflow: hidden;
    background: #0B1620;
  }
  .th img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s var(--ease); }
  .item:hover .th img { transform: scale(1.06); }
  .th .eq {
    position: absolute; right: 6px; bottom: 6px;
    padding: 4px 5px; height: 19px;
    border-radius: 4px; background: rgba(8,16,24,.8);
    display: none;
  }
  .item[aria-current="true"] .th .eq { display: inline-flex; }

  .it-title {
    margin: 0;
    font: 600 14px/1.35 var(--font-body);
    color: var(--white);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .it-src {
    display: block;
    margin: 3px 0 0;
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .empty {
    margin: 0;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  /* =================== Mobile (<750px) ===================
     Wix Classic mobile: 320px page. Stacks, player keeps true 16:9, and
     the playlist is a fixed-height scroller so 32 talks never make the
     section long. Not height-locked; shared/fit.js fits it to the box. */
  @media (max-width: 749.98px) {
    .lib { padding: 28px 0 24px; min-height: 0; }
    .shell { padding: 0 14px; }

    .top { flex-direction: column; align-items: stretch; gap: 14px; margin-bottom: 14px; }
    .intro .eyebrow { font-size: 11px; margin-bottom: 8px; }
    .intro .h2 { font-size: 28px; }
    .lede { font-size: 14px; margin-top: 6px; }
    .search { width: 100%; }
    .search input { height: 44px; font-size: 14px; }

    .tabs { margin-bottom: 14px; height: 38px; }
    .tab { height: 36px; padding: 0 12px; font-size: 13px; }

    .row { display: block; height: auto; }
    .stage { height: auto; aspect-ratio: 16 / 9; border-radius: 12px; }
    .big-play { width: 58px; height: 58px; margin: -29px 0 0 -29px; }
    .big-play svg { width: 22px; height: 22px; }

    .now { height: auto; padding-top: 12px; flex-direction: column; gap: 10px; }
    .now h3 { font-size: 18px; }
    .controls { width: 100%; }
    .yt-link { margin-left: auto; height: 38px; font-size: 12.5px; }
    .icon-btn { width: 38px; height: 38px; }

    .playlist { height: 300px; margin-top: 14px; border-radius: 12px; }
    .pl-head { height: 44px; padding: 0 14px; }
    .item { grid-template-columns: 96px 1fr; gap: 10px; padding: 6px; }
    .th { width: 96px; height: 54px; }
    .it-title { font-size: 13px; }
    .it-src { font-size: 11.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .big-play::before, .eq i { animation: none; }
  }
</style>
</head>
<body>

<section class="lib" data-fit>
  <div class="shell">

    <header class="top" data-reveal>
      <div class="intro">
        <p class="eyebrow">Speaking &amp; media</p>
        <h2 class="h2">Watch Tanya <em>in action</em></h2>
        <p class="p2 lede">Keynotes, podcasts and interviews on driver health, mindful eating
          and building a culture of wellness.</p>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search all talks" aria-label="Search talks" autocomplete="off">
      </label>
    </header>

    <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by topic" data-reveal data-reveal-delay="60"></div>

    <div class="row" data-reveal data-reveal-delay="120">

      <div class="player">
        <div class="stage" id="stage">
          <button class="poster" id="poster" type="button" aria-label="Play video">
            <img id="posterImg" alt="">
            <span class="big-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></span>
          </button>
        </div>

        <div class="now paused" id="now">
          <div class="now-text">
            <p class="now-eyebrow"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="nowCat"></span></p>
            <h3 id="nowTitle"></h3>
            <p class="now-source" id="nowSource"></p>
          </div>
          <div class="controls">
            <button class="icon-btn" id="prev" type="button" aria-label="Previous talk"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="icon-btn" id="next" type="button" aria-label="Next talk"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
            <a class="yt-link" id="ytLink" href="https://www.youtube.com/channel/UC15hfpx2WiTtIOXKUhV63aQ">
              YouTube
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </a>
          </div>
        </div>
      </div>

      <aside class="playlist" aria-label="Playlist">
        <div class="pl-head"><strong id="count"></strong><span>Up next</span></div>
        <ol class="list" id="list"></ol>
      </aside>

    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var CATS = [
    { id: 'all',     name: 'All talks' },
    { id: 'driver',  name: 'Driver Health' },
    { id: 'eating',  name: 'Mindful Eating' },
    { id: 'culture', name: 'Wellness Culture' },
    { id: 'podcast', name: 'Podcasts & Interviews' },
    { id: 'story',   name: 'Her Story & Awards' }
  ];

  /* [YouTube ID, title, channel / source, category] — order = playlist order */
  var TALKS = [
    ['SyQVqXAktHM', 'From Idea to Impact: The Story Behind LIT Wellness Solutions', 'AI TrueScale', 'story'],
    ['XtZfPaQLMDw', 'Hauling Toward Health: Wellness on the Road and Beyond', 'Women In Trucking Association', 'driver'],
    ['gz9lhMQmarc', 'Why Counting Calories Is the Wrong Way to Manage Your Weight', 'Holistic Health', 'eating'],
    ['x2wdNmGS4Vc', 'Breaking Diet Culture to Create a Culture of Wellness', 'Gez Perez Thrive', 'culture'],
    ['FSKtF2QVSWg', 'The Healing Place Podcast: It Isn’t Just About the Food', 'Teri Wellbrock', 'podcast'],
    ['fqls0O_pYsM', 'What the Health? Proactive Steps Toward Driver Health & Wellness', '2023 Accelerate! Conference · Women In Trucking', 'driver'],
    ['O3U9iJxW9lg', 'The Diet Culture You STILL Don’t Understand', 'Sally Pederson', 'eating'],
    ['56WIjsefxyY', 'Visionaries Award — Health 2.0 Conference USA 2023', 'Health 2.0 Conference', 'story'],
    ['liGum3hGeBw', 'Overcoming Disordered Eating: Tanya’s Story', 'LIT Wellness Solutions', 'story'],
    ['WZkf3h0TfbY', 'FIT DRIVERS Episode 18: Tanya Jolliffe', 'Fit Drivers Podcast', 'driver'],
    ['IUdZvyEJk60', 'Mindful Eating Instead of Diets', 'LIT Wellness Solutions', 'eating'],
    ['iictH-4zqQ4', 'Eat Right, Live Healthy — Female Founders Podcast #060', 'WomELLE', 'podcast'],
    ['_XxdHwkYa2w', 'Stop Escaping into Comfort: How to Conquer Your Addictions', 'LIT Wellness Solutions', 'culture'],
    ['Eq1IRb195Bs', 'Driver Health and Fitness: How to Make It a Priority', 'Panel discussion · LIT Wellness Solutions', 'driver'],
    ['E-md4EvpIJc', 'How and Why of The Mindful Me Journey Journaling Program', 'LIT Wellness Solutions', 'eating'],
    ['D4z9t84bDig', 'Tanya Fasnacht Jolliffe, Honored Member of IAOTP', 'International Association of Top Professionals', 'story'],
    ['zKuz6xWM2RY', 'This Is Trucking with Bob Perry, Tanya Jolliffe & Dean Croke', 'BCB Live · December 16, 2022', 'driver'],
    ['Z6exP0WAWxs', 'Explanation of Stress', 'LIT Wellness Solutions', 'culture'],
    ['s9qGqsMw0nU', 'The Xero Hour Podcast with Tanya Jolliffe', 'The Xero Hour', 'podcast'],
    ['nqDGd17d1EI', 'Becoming a Mindful Eater', 'LIT Wellness Solutions', 'eating'],
    ['2OBerBAeGJQ', 'BCB Live! Interview on Transportation Wellness and Culture', 'BCB Live', 'driver'],
    ['IfSLUSSinfc', 'Wellness Culture FB Live', 'LIT Wellness Solutions', 'culture'],
    ['B5a1a6_zpXo', 'The Creative Nomad Show', 'True Awesome Network', 'podcast'],
    ['Vsz_OxJPMkM', 'The Keto Diet: Why It’s Bad for You', 'LIT Wellness Solutions · 2022', 'eating'],
    ['fIx6dFy_T-E', 'BCB Live Accelerate Interview', 'BCB Live', 'driver'],
    ['CufiFIVI_R8', 'Day 11: Creating a Culture of Wellness', 'Fit for Christ Sisters', 'culture'],
    ['p-4sWAbwo8w', 'Unstoppable Woman Summit', 'LIT Wellness Solutions', 'podcast'],
    ['aWGUfUsZFPM', 'Predictions for 2024: How to Prepare for What’s to Come', 'Life Coach Code', 'culture'],
    ['b2wrTMiHFqM', 'Mindful Me Journey: Perspective Transformation', 'Mentor Marnie', 'eating'],
    ['CMXpadZZN0M', 'Healthy Mom Presentation', 'LIT Wellness Solutions', 'culture'],
    ['bMJFCN5QihI', 'Health and Wellness in 2021 — Tanya Jolliffe ’88', 'MSJ Alumni Relations', 'story'],
    ['ASmUQjnlHPg', 'Personal Passion Statement', 'LIT Wellness Solutions', 'story']
  ].map(function (t) { return { id: t[0], title: t[1], source: t[2], cat: t[3] }; });

  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var catName = {}; CATS.forEach(function (c) { catName[c.id] = c.name; });

  var state = {
    cat: catName[params.get('cat')] ? params.get('cat') : 'all',
    q: '',
    current: null,
    playing: false
  };

  function visible() {
    var q = state.q.trim().toLowerCase();
    return TALKS.filter(function (t) {
      if (state.cat !== 'all' && t.cat !== state.cat) return false;
      if (!q) return true;
      return (t.title + ' ' + t.source + ' ' + catName[t.cat]).toLowerCase().indexOf(q) !== -1;
    });
  }

  function thumb(id, size) { return 'https://i.ytimg.com/vi/' + id + '/' + size + '.jpg'; }

  /* ---------- Tabs ---------- */
  function renderTabs() {
    var tabs = $('tabs');
    tabs.innerHTML = '';
    CATS.forEach(function (c) {
      var n = c.id === 'all' ? TALKS.length : TALKS.filter(function (t) { return t.cat === c.id; }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('aria-pressed', String(c.id === state.cat));
      b.innerHTML = '<span></span><b>' + n + '</b>';
      b.firstChild.textContent = c.name;
      b.addEventListener('click', function () {
        state.cat = c.id;
        renderTabs();
        renderList();
        var list = visible();
        if (list.length && list.indexOf(state.current) === -1) select(list[0], false);
      });
      tabs.appendChild(b);
    });
  }

  /* ---------- Playlist ---------- */
  function renderList() {
    var list = visible();
    var ol = $('list');
    ol.innerHTML = '';
    $('count').textContent = list.length + (list.length === 1 ? ' talk' : ' talks');

    if (!list.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No talks match “' + state.q.trim() + '”.';
      ol.appendChild(li);
      return;
    }

    list.forEach(function (t) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('aria-current', String(t === state.current));
      b.innerHTML =
        '<span class="th"><img loading="lazy" alt=""><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span>' +
        '<span><span class="it-title"></span><span class="it-src"></span></span>';
      b.querySelector('img').src = thumb(t.id, 'mqdefault');
      b.querySelector('.it-title').textContent = t.title;
      b.querySelector('.it-src').textContent = t.source;
      b.addEventListener('click', function () { select(t, true); });
      li.appendChild(b);
      ol.appendChild(li);
    });
  }

  function markCurrent() {
    var items = $('list').querySelectorAll('.item');
    var list = visible();
    Array.prototype.forEach.call(items, function (el, i) {
      var on = list[i] === state.current;
      el.setAttribute('aria-current', String(on));
      if (on) {
        var box = $('list');
        var top = el.offsetTop - box.offsetTop;
        if (top < box.scrollTop || top + el.offsetHeight > box.scrollTop + box.clientHeight) {
          box.scrollTo({ top: Math.max(0, top - 8), behavior: 'smooth' });
        }
      }
    });
  }

  /* ---------- Player ---------- */
  function setPoster(t) {
    var img = $('posterImg');
    /* maxresdefault does not exist for every upload (5 of the 32 today).
       YouTube answers 404 — sometimes with a 120px grey placeholder that
       still "loads" — so fall back on either signal. */
    function fallback() {
      if (img.src.indexOf('maxresdefault') !== -1) img.src = thumb(t.id, 'hqdefault');
    }
    img.onerror = fallback;
    img.onload = function () { if (img.naturalWidth <= 120) fallback(); };
    img.src = thumb(t.id, 'maxresdefault');
    img.alt = 'Video: ' + t.title;
  }

  function play(t) {
    var stage = $('stage');
    var old = stage.querySelector('iframe');
    if (old) old.remove();
    $('poster').hidden = true;

    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + t.id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title = t.title;
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    f.setAttribute('allowfullscreen', '');
    stage.appendChild(f);

    state.playing = true;
    $('now').classList.remove('paused');
  }

  function select(t, autoplay) {
    state.current = t;
    $('nowTitle').textContent = t.title;
    $('nowSource').textContent = t.source;
    $('nowCat').textContent = (autoplay || state.playing ? 'Now playing · ' : 'Featured · ') + catName[t.cat];
    $('ytLink').href = 'https://www.youtube.com/watch?v=' + t.id;
    markCurrent();

    if (autoplay || state.playing) {
      play(t);
    } else {
      setPoster(t);
    }
  }

  function step(dir) {
    var list = visible();
    if (!list.length) list = TALKS;
    var i = list.indexOf(state.current);
    var next = list[(i + dir + list.length) % list.length];
    select(next, state.playing);
  }

  $('poster').addEventListener('click', function () { select(state.current, true); });
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; renderList(); markCurrent(); });

  /* ---------- Start ---------- */
  renderTabs();
  renderList();
  var start = TALKS.filter(function (t) { return t.id === params.get('v'); })[0] || visible()[0] || TALKS[0];
  select(start, false);
})();
</script>
<script src="shared/fit.js"></script>
<script src="shared/embed.js"></script>
</body>
